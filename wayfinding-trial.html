<meta charset="utf-8">
<title>Wayfinding Trial</title>
<style>
  :root {
    /* doTERRA Pure - Base 1.2.2 tokens */
    --paper: #F6F7F8;
    --paper-raised: #FFFFFF;
    --ink: #354657;
    --muted: rgba(53,70,87,0.64);
    --line: rgba(190,196,201,0.55);
    --line-strong: #BEC4C9;
    --accent: #9D57B2;
    --accent-ink: #FFFFFF;
    --accent-tint: #EADAEE;
    --accent-glow: rgba(157,87,178,0.32);
    --success: #12B76A;
    --success-bg: rgba(18,183,106,0.12);
    --fail: #F04438;
    --fail-bg: rgba(240,68,56,0.12);
    --warn: #F79009;
    --warn-bg: rgba(247,144,9,0.12);
    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 16px;
    --shadow: 0 1px 2px rgba(53,70,87,0.08), 0 6px 16px rgba(53,70,87,0.10);
    --font-display: 'Rawline', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-body: 'Rawline', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    /* Without this, native controls like the checkbox below follow the
       OS/browser's own dark-mode preference instead of this app's theme --
       so on a dark system it renders with dark chrome even while the page
       itself is showing the light theme. */
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #1B2430;
      --paper-raised: #232E3D;
      --ink: #E7ECEF;
      --muted: rgba(231,236,239,0.64);
      --line: rgba(190,196,201,0.22);
      --line-strong: rgba(190,196,201,0.4);
      --accent: #BD8BCA;
      --accent-ink: #2B1730;
      --accent-tint: rgba(157,87,178,0.2);
      --accent-glow: rgba(189,139,202,0.4);
      --success: #12B76A;
      --success-bg: rgba(18,183,106,0.18);
      --fail: #F04438;
      --fail-bg: rgba(240,68,56,0.18);
      --warn: #F79009;
      --warn-bg: rgba(247,144,9,0.18);
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 20px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #1B2430;
    --paper-raised: #232E3D;
    --ink: #E7ECEF;
    --muted: rgba(231,236,239,0.64);
    --line: rgba(190,196,201,0.22);
    --line-strong: rgba(190,196,201,0.4);
    --accent: #BD8BCA;
    --accent-ink: #2B1730;
    --accent-tint: rgba(157,87,178,0.2);
    --accent-glow: rgba(189,139,202,0.4);
    --success: #12B76A;
    --success-bg: rgba(18,183,106,0.18);
    --fail: #F04438;
    --fail-bg: rgba(240,68,56,0.18);
    --warn: #F79009;
    --warn-bg: rgba(247,144,9,0.18);
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 20px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }
  img { max-width: 100%; }

  a { color: var(--accent); }

  /* ---------- Motion ---------- */
  /* Small, functional transitions everywhere by default (color/background/
     border changes are not considered motion that needs reducing). */
  button, .leaf-btn, .branch-btn, .icon-btn, nav.views button, .chip, input[type="text"], textarea {
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
  }
  @media (prefers-reduced-motion: no-preference) {
    button, .icon-btn { transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease; }
    button:active { transform: scale(0.97); }
    main.phase-enter { animation: motionCardIn 0.28s ease both; }
    .confirm-bar { animation: motionRiseIn 0.22s ease both; }
    .leaf-btn.selected, .badge { animation: motionPop 0.16s ease; }
    .export-menu { animation: motionRiseIn 0.15s ease both; }
    .shortcuts-panel { animation: motionRiseIn 0.18s ease both; }
    @keyframes motionCardIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes motionRiseIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes motionPop {
      from { transform: scale(0.94); }
      to { transform: scale(1); }
    }
  }

  .wrap {
    max-width: 920px;
    margin: 0 auto;
    padding-inline: 20px;
  }
  .wrap.wide { max-width: 1180px; }

  header.top {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .top-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding-block: 14px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .brand .logo {
    display: flex;
    align-items: center;
    color: var(--ink);
  }
  .brand .logo svg {
    display: block;
    height: 24px;
    width: auto;
  }
  .brand h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0;
  }
  nav.views {
    display: flex;
    gap: 6px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
  }
  nav.views button {
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-weight: 600;
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
  }
  nav.views button.active {
    background: var(--ink);
    color: var(--paper);
  }

  .icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    flex: 0 0 auto;
    border: 1px solid var(--line);
    background: var(--paper-raised);
    color: var(--muted);
    border-radius: 999px;
    cursor: pointer;
    padding: 0;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--line-strong); }
  .icon-btn svg { display: block; }
  .chevron-down { transform: rotate(90deg); }

  .export-menu-wrap { position: relative; display: inline-flex; }
  .export-menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    min-width: 170px;
    background: var(--paper-raised);
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 4px;
    z-index: 30;
    display: flex;
    flex-direction: column;
  }
  .export-menu button {
    border: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    text-align: left;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  .export-menu button:hover { background: var(--paper); }

  main { padding-block: 28px 64px; }

  .card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 24px;
  }
  .card + .card { margin-top: 18px; }

  h2 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 22px;
    margin: 0 0 4px;
    text-wrap: balance;
  }
  p.hint { color: var(--muted); font-size: 14px; margin: 0 0 18px; max-width: 60ch; }

  .eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .eyebrow.muted { color: var(--muted); }
  .handoff-card { text-align: center; padding: 52px 24px; }
  .handoff-card .scenario { font-size: 22px; }
  .handoff-card .hint { margin: 0 auto 22px; }
  .handoff-card .btn-row { justify-content: center; }
  .btn-big { font-size: 16px; padding: 16px 30px; }

  .handoff-graphic {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    margin: 6px 0 24px;
  }
  .handoff-party {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    color: var(--accent);
    transition: color 0.2s ease;
  }
  .handoff-party.dim { color: var(--muted); opacity: 0.55; }
  .handoff-icon {
    width: 56px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    border: 2px solid currentColor;
  }
  .handoff-icon svg { display: block; }
  .handoff-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .handoff-arrow { color: var(--line-strong); flex: 0 0 auto; }
  .handoff-arrow.reverse svg { transform: scaleX(-1); }

  .session-chevron {
    display: inline-flex;
    flex: 0 0 auto;
    color: var(--muted);
    transition: transform 0.15s ease;
  }
  .session-chevron.expanded { transform: rotate(90deg); }

  label.field {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input[type="text"], textarea {
    width: 100%;
    font: inherit;
    font-size: 15px;
    padding: 10px 12px;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    background: var(--paper);
    color: var(--ink);
  }
  textarea { resize: vertical; min-height: 64px; }
  textarea.code-editor {
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.5;
    min-height: 340px;
    white-space: pre;
  }
  input[type="text"]:focus, textarea:focus, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  /* Built from scratch rather than left native: relying on the browser's
     own checkbox chrome (even with accent-color / color-scheme set) still
     rendered dark on some platforms regardless of this app's own theme.
     A fully custom box keyed to our own tokens can't drift from it. */
  input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    margin: 0;
    flex-shrink: 0;
    border: 1.5px solid var(--line-strong);
    border-radius: 5px;
    background: var(--paper-raised);
    display: inline-block;
    vertical-align: middle;
    position: relative;
    cursor: pointer;
  }
  input[type="checkbox"]:checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  input[type="checkbox"]:checked::after {
    content: "";
    position: absolute;
    left: 5px;
    top: 1px;
    width: 5px;
    height: 9px;
    border: solid var(--accent-ink);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  input[type="checkbox"]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .notes-cell { min-width: 220px; }
  textarea.notes-edit {
    font-size: 13px;
    padding: 8px 10px;
    min-height: 44px;
    margin-bottom: 6px;
  }
  .notes-save { font-size: 12px; padding: 6px 12px; }
  .notes-save:disabled { opacity: 0.45; cursor: not-allowed; }

  .session-row-toggle {
    background: none;
    border: none;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
    padding: 4px 2px;
    margin: -4px -2px;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    border-radius: 6px;
  }

  main[tabindex="-1"] { outline: none; }

  /* ---------- Keyboard shortcuts panel ---------- */
  .shortcuts-backdrop {
    position: fixed; inset: 0;
    background: rgba(30, 34, 38, 0.4);
    z-index: 700;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .shortcuts-panel {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 24px;
    max-width: 420px;
    width: 100%;
    max-height: min(560px, 80vh);
    overflow-y: auto;
  }
  .shortcuts-panel h2 { margin-top: 0; }
  .shortcuts-list { list-style: none; margin: 0; padding: 0; }
  .shortcuts-list li {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  .shortcuts-list li:last-child { border-bottom: none; }
  .shortcuts-list .desc { font-size: 14px; }
  .shortcuts-list .scope { display: block; font-size: 12px; color: var(--muted); }
  .kbd-row { display: flex; gap: 4px; flex-shrink: 0; }
  kbd.kbd {
    font-family: var(--font-mono);
    font-size: 12px;
    background: var(--paper);
    border: 1px solid var(--line-strong);
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 3px 7px;
    color: var(--ink);
  }

  .btn {
    font: inherit;
    font-weight: 700;
    font-size: 14px;
    border: 1px solid transparent;
    border-radius: 9px;
    padding: 11px 18px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
  /* The small "press Enter" hint on a screen's one highlighted CTA
     (.cta-primary) -- always on an accent-colored button, so a plain
     translucent-white pill reads fine in both themes without its own
     tokens. */
  .cta-key {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 20px;
    padding: 1px 6px;
    border-radius: 5px;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    line-height: 1.4;
    background: rgba(255,255,255,0.22);
    border: 1px solid rgba(255,255,255,0.4);
    color: inherit;
  }
  .btn-ghost { background: transparent; color: var(--ink); border-color: var(--line-strong); }
  .btn-quiet { background: transparent; color: var(--muted); border-color: transparent; padding: 8px 10px; font-size: 13px; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .think-aloud-note {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-style: italic;
    color: var(--muted);
  }
  .think-aloud-icon { display: inline-flex; flex: 0 0 auto; }

  .progress-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .progress-row .step {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
  .timer {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 22px;
    font-weight: 600;
    background: var(--accent-tint);
    color: var(--ink);
    padding: 4px 12px;
    border-radius: 8px;
  }

  .scenario {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 26px;
    line-height: 1.25;
    text-wrap: balance;
    margin: 0 0 6px;
    display: inline-block;
    max-width: 100%;
  }
  .scenario-meta { font-size: 13px; color: var(--muted); margin-bottom: 18px; }

  .breadcrumb {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 16px;
    min-height: 20px;
  }
  .breadcrumb button {
    background: none;
    border: none;
    color: var(--accent);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    padding: 0;
  }
  .breadcrumb .sep { color: var(--line-strong); }

  .branch-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    margin-bottom: 12px;
  }
  .branch-btn {
    background: var(--paper);
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    padding: 14px 14px;
    font: inherit;
    font-weight: 600;
    font-size: 14px;
    text-align: left;
    cursor: pointer;
    color: var(--ink);
  }
  .branch-btn:hover { border-color: var(--accent); }
  .branch-btn.open { border-color: var(--accent); background: var(--accent-tint); }
  .branch-btn .arrow { float: right; color: var(--muted); }

  .leaf-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 12px 4px 4px 18px;
    border-left: 2px solid var(--line);
    margin: 4px 0 16px 8px;
  }
  .leaf-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: none;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 9px 10px;
    font: inherit;
    font-size: 14px;
    text-align: left;
    cursor: pointer;
    color: var(--ink);
  }
  .leaf-btn:hover { background: var(--paper); border-color: var(--line-strong); }
  .leaf-btn.selected {
    background: var(--accent-tint);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  .leaf-check { display: inline-flex; flex: 0 0 auto; color: var(--accent); }

  .confirm-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    background: var(--accent-tint);
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 14px 16px;
    margin-top: 8px;
  }
  .confirm-bar .path { font-weight: 600; font-size: 14px; }

  /* Audience filter. Staff already know this navigation structure, so
     their runs are not comparable to a customer's: blending the two lifts
     every success figure on this tab. The control drives the per-task
     stats, the session log and the export together, so what you read is
     always what you would send. */
  .audience-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .audience-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .seg {
    display: flex;
    gap: 4px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
  }
  .seg button {
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-weight: 600;
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .seg button.active { background: var(--ink); color: var(--paper); }
  .seg button:disabled { opacity: 0.4; cursor: not-allowed; }
  .seg-n {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    opacity: 0.75;
  }
  .info-note { font-size: 13px; color: var(--muted); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-top: 14px; }

  .chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line-strong);
    background: var(--paper);
    color: var(--ink);
    border-radius: 999px;
    padding: 7px 14px;
    font: inherit;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  .chip.selected { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge.direct-success { background: var(--success-bg); color: var(--success); }
  .badge.indirect-success { background: var(--warn-bg); color: var(--warn); }
  .badge.direct-fail, .badge.indirect-fail { background: var(--fail-bg); color: var(--fail); }

  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 700; }
  tbody tr:last-child td { border-bottom: none; }
  .table-scroll { overflow-x: auto; }
  td.num, th.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat-tile { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .stat-tile .n { font-family: var(--font-mono); font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat-tile .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }

  .empty { color: var(--muted); font-size: 14px; padding: 30px 0; text-align: center; }
  .warn-note { font-size: 13px; color: var(--warn); background: var(--warn-bg); border-radius: 8px; padding: 10px 12px; margin-top: 14px; }
  .onboard-spotlight {
    position: fixed;
    border-radius: 14px;
    box-shadow: 0 0 0 9999px rgba(30, 34, 38, 0.4), 0 0 0 2px var(--accent-glow), 0 0 0 5px var(--accent-glow);
    pointer-events: none;
    z-index: 600;
    transition: top 0.2s ease, left 0.2s ease, width 0.2s ease, height 0.2s ease;
  }
  .onboard-tip {
    position: fixed;
    z-index: 601;
    background: var(--paper-raised);
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 14px 16px;
    font-family: var(--font-body);
    color: var(--ink);
  }
  .onboard-step-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .onboard-tip-title { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .onboard-tip-text { font-size: 13px; color: var(--muted); line-height: 1.4; margin-bottom: 12px; }
  .onboard-tip-actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .onboard-skip {
    background: none;
    border: 0;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    padding: 6px 4px;
    text-decoration: underline;
  }

  details.method summary { cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted); }
  details.method { margin-top: 18px; }
  details.method .body { font-size: 13px; color: var(--muted); margin-top: 10px; max-width: 68ch; }

  @media (max-width: 480px) {
    .brand h1 { font-size: 22px; }
    .scenario { font-size: 21px; }
    .card { padding: 18px; }
  }
</style>

  // Floating onboarding tour: two steps shown on the first task's start
  // screen, plus a third covering the tree-nav screen itself once the task
  // is under way (see goActive()) -- each pointing at a real element via
  // id, and each tagged with the app phase it belongs to so the tour never
  // tries to render a step's target on the wrong screen.
  var ONBOARD_STEPS = [
    { target: "onboard-target-scenario", phase: "question", title: "Your task",
      text: "Each task gives you a short, real-world scenario like this one. Read it over, there's no rush." },
    { target: "onboard-target-start", phase: "question", title: "Where to start",
      text: "When you're ready, press Start here. The task will begin and you can browse freely from there." },
    { target: "onboard-target-tree", phase: "active", title: "Finding it",

  ];

  function removeOnboardTour() {
    var root = document.getElementById("onboard-tour-root");

  // Ends the tour and returns focus to the next thing the participant would
  // naturally interact with, since the tip's own buttons (where focus was)
  // are about to be removed from the page. Also resumes the task timer if
  // this was the tree-nav step, which pauses it while shown (see
  // pauseTimerForOnboard()) -- a no-op otherwise.
  function skipOnboardTour() {
    var wasActive = phase === "active";
    onboardStep = null;
    removeOnboardTour();
    resumeTimerFromOnboard();
    var target = wasActive
      ? document.querySelector("#onboard-target-tree .breadcrumb button")
      : document.getElementById("onboard-target-start");
    if (target) target.focus();
  }

  function renderOnboardTour() {
    removeOnboardTour();
    if (!onboardStep) return;
    var stepDef = ONBOARD_STEPS[onboardStep - 1];
    if (phase !== stepDef.phase) return;
    var targetEl = document.getElementById(stepDef.target);
    if (!targetEl) return;
    var rect = targetEl.getBoundingClientRect();

    var root = document.createElement("div");
    root.id = "onboard-tour-root";

    var spot = document.createElement("div");
    spot.className = "onboard-spotlight";
    spot.style.top = (rect.top - 14) + "px";
    spot.style.left = (rect.left - 14) + "px";
    spot.style.width = (rect.width + 28) + "px";
    spot.style.height = (rect.height + 28) + "px";
    root.appendChild(spot);

    var tip = document.createElement("div");
    tip.className = "onboard-tip";
    tip.setAttribute("role", "dialog");
    tip.setAttribute("aria-labelledby", "onboard-tip-title");
    tip.setAttribute("aria-describedby", "onboard-tip-text");
    tip.tabIndex = -1;
    var tipWidth = Math.min(280, window.innerWidth - 24);
    var left = Math.min(Math.max(rect.left, 12), window.innerWidth - tipWidth - 12);
    tip.style.left = left + "px";
    tip.style.width = tipWidth + "px";
    var tipGap = 26; // clears the spotlight's own padding plus a visual gap
    var spaceBelow = window.innerHeight - rect.bottom;
    if (spaceBelow < 180 && rect.top > 180) {
      tip.style.bottom = (window.innerHeight - rect.top + tipGap) + "px";
    } else {
      tip.style.top = (rect.bottom + tipGap) + "px";
    }

    // Numbered within this step's own mini-tour (the two question-phase
    // steps, or the single active-phase one) rather than across all of
    // them, since there's a real gap in time between the two tours.
    var phaseSteps = ONBOARD_STEPS.filter(function (s) { return s.phase === stepDef.phase; });
    var localIndex = phaseSteps.indexOf(stepDef) + 1;
    var isLastOfPhase = localIndex >= phaseSteps.length;

    var stepLabel = document.createElement("div");
    stepLabel.className = "onboard-step-label";
    stepLabel.textContent = "STEP " + localIndex + " OF " + phaseSteps.length;
    tip.appendChild(stepLabel);

    var titleEl = document.createElement("div");
    titleEl.className = "onboard-tip-title";
    titleEl.id = "onboard-tip-title";
    titleEl.textContent = stepDef.title;
    tip.appendChild(titleEl);

    var textEl = document.createElement("div");
    textEl.className = "onboard-tip-text";
    textEl.id = "onboard-tip-text";
    textEl.textContent = stepDef.text;
    tip.appendChild(textEl);

    var actions = document.createElement("div");
    actions.className = "onboard-tip-actions";

    var skipBtn = document.createElement("button");
    skipBtn.className = "onboard-skip";
    skipBtn.textContent = "Skip";
    skipBtn.addEventListener("click", skipOnboardTour);
    actions.appendChild(skipBtn);

    var navGroup = document.createElement("div");
    navGroup.style.display = "flex";
    navGroup.style.gap = "8px";

    // Back only makes sense within the same mini-tour -- stepping back
    // across the question/active boundary would try to render a step
    // whose target doesn't exist on the current screen.
    if (onboardStep > 1 && ONBOARD_STEPS[onboardStep - 2].phase === stepDef.phase) {
      var backBtn = document.createElement("button");
      backBtn.className = "btn btn-ghost";
      backBtn.textContent = "Back";
      backBtn.addEventListener("click", function () { onboardStep--; renderOnboardTour(); });
      navGroup.appendChild(backBtn);
    }

    var nextBtn = document.createElement("button");
    nextBtn.className = "btn btn-primary";
    nextBtn.textContent = isLastOfPhase ? "Got it" : "Next →";
    nextBtn.addEventListener("click", function () {
      if (isLastOfPhase) { skipOnboardTour(); }
      else { onboardStep++; renderOnboardTour(); }
    });
    navGroup.appendChild(nextBtn);

    actions.appendChild(navGroup);
    tip.appendChild(actions);

    root.appendChild(tip);
    document.body.appendChild(root);
    // Move keyboard focus into the tip so it doesn't get stranded on the
    // (now off-screen or removed) element that opened this step, and so
    // screen readers announce the step via aria-labelledby/describedby.
    tip.focus();
  }

  function el(tag, attrs, children) {

      else if (k === "html") e.innerHTML = attrs[k];
      else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);

  function copyToClipboard(text, btn, textareaEl) {
    var original = btn.textContent;
    function done(ok) {
      btn.textContent = ok ? "Copied" : "Press Ctrl/Cmd+C";
      setTimeout(function () { btn.textContent = original; }, 1500);
    }
    function fallbackCopy() {
      // No visible textarea to select (e.g. a ledger export button) --
      // use a throwaway offscreen one so execCommand still has a selection.
      var el = textareaEl;
      var temp = null;
      if (!el) {
        temp = document.createElement("textarea");
        temp.value = text;
        temp.style.position = "fixed";
        temp.style.top = "-1000px";
        temp.style.left = "-1000px";
        document.body.appendChild(temp);
        el = temp;
      }
      el.focus();
      el.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      if (temp) temp.remove();
      done(ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, fallbackCopy);
    } else {

  }

  // ---------- Local storage fallback ----------
  // When the shared db capability isn't available -- the file opened
  // directly, or served from a plain local server, rather than run as the
  // published Artifact -- results used to just live in memory and vanish
  // on reload with no warning. Everything that would otherwise go straight
  // to `db` now falls back to this browser's own localStorage instead, so
  // a moderator running it standalone still gets something durable: not
  // synced to any other device, but not silently discarded either.

  // "shared" -- a live, cross-device ledger (the published Artifact).
  // "local" -- this browser's own storage only (opened as a plain file, or
  // via a local server, with nothing more than localStorage behind it).
  // "none" -- neither is available; nothing persists past this page view.
  function storageMode() {
    if (dbReady && db) return "shared";
    if (localStorageOk) return "local";
    return "none";
  }

  function localLedgerRead() {
    try {

      var docs = raw ? JSON.parse(raw) : [];
      return Array.isArray(docs) ? docs : [];
    } catch (e) { return []; }
  }
  function localLedgerWrite(docs) {
    try { window.localStorage.setItem(LOCAL_LEDGER_KEY, JSON.stringify(docs)); } catch (e) {}
  }
  // No live listener needed for a single browser's own storage -- just
  // re-read it into ledgerDocs on demand, sorted the same way the shared
  // ledger's query would be (most recently finished/updated first).
  function refreshLocalLedger() {
    var docs = localLedgerRead();
    docs.sort(function (a, b) {

      var tb = b.finishedAt || b.updatedAt || "";

      return ta < tb ? 1 : -1;

  }

  // ---------- Capability bootstrap ----------
  function initCapabilities() {
    if (window.claude && window.claude.use) {
      window.claude.use("db").then(function (d) {
        db = d; dbReady = !!d; subscribeConfig(); subscribeLedger(); render();
      }).catch(function () { subscribeConfig(); subscribeLedger(); render(); });
      window.claude.use("downloads").then(function (d) { downloads = d; downloadsReady = !!d; render(); }).catch(function () {});
    } else {
      // No Artifact runtime here at all (opened directly, or served from a
      // plain local server) -- go straight to the local-storage fallback
      // rather than leaving everything unsubscribed.
      subscribeConfig();
      subscribeLedger();
    }
  }

  // ---------- Hot state (survive a republish mid-session) ----------
  function snapshotState() {
    return { view: view, phase: phase, participant: participant, practiceRun: practiceRun, participantInternal: participantInternal,
      taskIndex: taskIndex, openPath: openPath, backtrackCount: backtrackCount, visitedTop: visitedTop,
      startedAt: startedAt, candidatePath: candidatePath, confidence: confidence, results: results, theme: theme,
      activeTree: activeTree, activeTasks: activeTasks, activeContentVersion: activeContentVersion,
      successBacktrackTolerance: successBacktrackTolerance, navTrail: navTrail, sessionDocId: sessionDocId,
      sessionStartedAtIso: sessionStartedAtIso, sessionContentVersion: sessionContentVersion };
  }
  function restoreState(s) {
    if (!s) return;
    view = s.view || "session"; phase = s.phase || "setup"; participant = s.participant || "";
    practiceRun = !!s.practiceRun; participantInternal = !!s.participantInternal; taskIndex = s.taskIndex || 0; openPath = s.openPath || [];
    backtrackCount = s.backtrackCount || 0; visitedTop = s.visitedTop || null; startedAt = s.startedAt || 0;
    candidatePath = s.candidatePath || null; confidence = s.confidence || null; results = s.results || [];
    theme = s.theme || "light";
    activeTree = s.activeTree || DEFAULT_TREE; activeTasks = s.activeTasks || DEFAULT_TASKS;
    activeContentVersion = s.activeContentVersion || 1;
    successBacktrackTolerance = s.successBacktrackTolerance || 0;

  // ---------- Content config (moderator-editable IA + tasks, shared via db
  // when available, this browser's own storage otherwise) ----------
  function applyConfigData(data) {
    if (data && data.tree) activeTree = data.tree;
    if (data && data.tasks) activeTasks = data.tasks;
    activeContentVersion = (data && data.version) || 1;
    successBacktrackTolerance = (data && typeof data.successBacktrackTolerance === "number") ? data.successBacktrackTolerance : 0;
    contentUpdatedAt = (data && data.updatedAt) || null;
  }

  function subscribeConfig() {
    if (dbReady && db) {
      if (configUnsub) return;
      configUnsub = db.doc("config/content").onSnapshot(function (snap) {
        applyConfigData(snap.exists ? snap.data() : null);
        render();
      }, function () {});
      return;
    }
    if (localStorageOk) {
      try {
        var raw = window.localStorage.getItem(LOCAL_CONTENT_KEY);
        applyConfigData(raw ? JSON.parse(raw) : null);
      } catch (e) {}
    }
  }

  function validatePath(tree, path) {
    var node = tree;
    for (var i = 0; i < path.length; i++) {
      if (Array.isArray(node)) return i === path.length - 1 && node.indexOf(path[i]) !== -1;
      if (node == null || typeof node !== "object" || !(path[i] in node)) return false;
      node = node[path[i]];
    }
    return false; // ran out of path without hitting a leaf array entry
  }

  function saveContent(treeText, tasksText, toleranceText) {
    contentWarning = null;
    var parsedTolerance = parseInt(toleranceText, 10);
    if (!(parsedTolerance >= 0)) parsedTolerance = 0; // NaN or negative both fall back to the strict default
    var parsedTree, parsedTasks;
    try {
      parsedTree = JSON.parse(treeText);
    } catch (e) {
      contentError = "Navigation structure isn't valid JSON: " + e.message;
      render();
      return;
    }
    try {
      parsedTasks = JSON.parse(tasksText);
    } catch (e) {
      contentError = "Tasks aren't valid JSON: " + e.message;
      render();
      return;
    }
    if (!parsedTree || typeof parsedTree !== "object" || Array.isArray(parsedTree)) {
      contentError = "Navigation structure must be a JSON object.";
      render();
      return;
    }
    if (!Array.isArray(parsedTasks) || !parsedTasks.length) {
      contentError = "Tasks must be a non-empty JSON array.";
      render();
      return;
    }
    for (var i = 0; i < parsedTasks.length; i++) {
      var t = parsedTasks[i];
      if (!t || typeof t.scenario !== "string" || !Array.isArray(t.accepted) || !t.accepted.length) {
        contentError = "Task " + (i + 1) + " needs a scenario and at least one accepted path.";
        render();
        return;
      }
    }
    var badPaths = [];
    parsedTasks.forEach(function (t, i) {
      t.accepted.forEach(function (p) {
        if (!validatePath(parsedTree, p)) badPaths.push("Task " + (i + 1) + ": " + p.join(" › "));
      });
    });
    contentError = null;
    contentWarning = badPaths.length
      ? "Saved, but these accepted paths don't resolve in the navigation structure and will never score as a success: " + badPaths.join("; ")
      : null;
    activeTree = parsedTree;
    activeTasks = parsedTasks;
    successBacktrackTolerance = parsedTolerance;
    activeContentVersion = (activeContentVersion || 0) + 1; // every save publishes a new version, even if only the tolerance changed
    contentUpdatedAt = new Date().toISOString();
    treeDraft = null; tasksDraft = null; toleranceDraft = null;
    var configPayload = { tree: parsedTree, tasks: parsedTasks, successBacktrackTolerance: parsedTolerance,
      version: activeContentVersion, updatedAt: contentUpdatedAt };
    if (dbReady && db) {
      db.doc("config/content").set(configPayload).catch(function () {});
    } else if (localStorageOk) {
      try { window.localStorage.setItem(LOCAL_CONTENT_KEY, JSON.stringify(configPayload)); } catch (e) {}
    }
    render();
  }

  function resetContent() {
    activeTree = DEFAULT_TREE;
    activeTasks = DEFAULT_TASKS;
    successBacktrackTolerance = 0;
    activeContentVersion = (activeContentVersion || 0) + 1;
    contentUpdatedAt = new Date().toISOString();
    treeDraft = null; tasksDraft = null; toleranceDraft = null; contentError = null; contentWarning = null;
    var resetPayload = { tree: DEFAULT_TREE, tasks: DEFAULT_TASKS, successBacktrackTolerance: 0,
      version: activeContentVersion, updatedAt: contentUpdatedAt };
    if (dbReady && db) {
      db.doc("config/content").set(resetPayload).catch(function () {});
    } else if (localStorageOk) {
      try { window.localStorage.setItem(LOCAL_CONTENT_KEY, JSON.stringify(resetPayload)); } catch (e) {}
    }
    render();
  }

  function toggleTheme() { theme = theme === "dark" ? "light" : "dark"; render(); }

  // ---------- Timer ----------
  function startTimerTick() {
    if (timerHandle) clearInterval(timerHandle);
    timerHandle = setInterval(function () {
      var t = document.getElementById("timer-readout");
      if (t) t.textContent = fmtTime(Date.now() - startedAt);
    }, 250);
  }
  function stopTimerTick() { if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } }

  // The onboarding tour's tree-nav step (see ONBOARD_STEPS) appears on top of
  // a task that's already timing -- freeze the clock while it's up so
  // reading the tour doesn't inflate that task's recorded time, then shift
  // startedAt forward by however long it was up so both the live readout and
  // the elapsed time saved in confirmCandidate() pick up exactly where they
  // left off.
  function pauseTimerForOnboard() {
    if (phase === "active" && startedAt && !onboardPauseStart) {
      onboardPauseStart = Date.now();
      stopTimerTick();
    }
  }
  function resumeTimerFromOnboard() {
    if (onboardPauseStart) {
      startedAt += (Date.now() - onboardPauseStart);
      onboardPauseStart = 0;
      if (phase === "active") startTimerTick();
    }
  }

  // ---------- Tree navigation actions ----------
  function findBranchBtn(level, key) {
    var btns = document.querySelectorAll(".branch-btn");
    for (var i = 0; i < btns.length; i++) {
      if (btns[i].dataset.level === String(level) && btns[i].dataset.key === key) return btns[i];
    }
    return null;
  }
  function findLeafBtn(leaf) {
    var btns = document.querySelectorAll(".leaf-btn");
    for (var i = 0; i < btns.length; i++) {
      if (btns[i].dataset.leaf === leaf) return btns[i];
    }
    return null;
  }
  function clickBranch(levelIndex, key) {
    var currentTop = openPath[0];
    if (levelIndex === 0) {
      if (currentTop && currentTop !== key) backtrackCount++;
      openPath = (currentTop === key) ? [] : [key];
    } else {
      var prefix = openPath.slice(0, levelIndex);
      var currentAtLevel = openPath[levelIndex];
      if (currentAtLevel && currentAtLevel !== key) backtrackCount++;
      openPath = (currentAtLevel === key) ? prefix : prefix.concat([key]);
    }
    // Log every state where a branch chain is open (skip the collapsed-to-
    // Home state) so the full route the participant explored can be
    // replayed later, not just the final path and a bare backtrack count.
    if (openPath.length) navTrail.push(openPath.slice());
    // The clicked branch button stays on screen (open or closed) even though
    // the whole tree is rebuilt underneath it -- keep keyboard focus there
    // instead of letting it drop to <body>.
    scheduleFocus(function () { return findBranchBtn(levelIndex, key); });
    render();
    if (openPath.length) {
      // Bring whatever just opened into view instead of leaving it below
      // the fold with no cue that anything changed.
      requestAnimationFrame(function () {
        var lists = document.querySelectorAll("#app .leaf-list, #app .branch-grid");
        var last = lists[lists.length - 1];

      });
    }
  }
  function clickLeaf(prefixPath, leaf) {

    scheduleFocus(function () { return findLeafBtn(leaf); });
    render();
    requestAnimationFrame(function () {
      var bar = document.querySelector(".confirm-bar");
      if (bar) bar.scrollIntoView({ behavior: "smooth", block: "end" });
    });
  }
  function cancelCandidate() {
    var leaf = candidatePath && candidatePath[candidatePath.length - 1];
    candidatePath = null;
    if (leaf) scheduleFocus(function () { return findLeafBtn(leaf); });
    render();
  }
  function confirmCandidate() {
    stopTimerTick();
    var elapsed = Date.now() - startedAt;
    var task = activeTasks[taskIndex];
    var success = task.accepted.some(function (p) { return pathsEqual(p, candidatePath); });
    // "Direct" allows up to successBacktrackTolerance branch switches before
    // a task is downgraded to Indirect -- configurable from the Content tab
    // instead of the fixed "any backtrack at all" rule this used to be.
    var direct = backtrackCount <= successBacktrackTolerance;
    var pending = { taskIndex: taskIndex, scenario: task.scenario, tests: task.tests,
      path: candidatePath.slice(), timeMs: elapsed, success: success, direct: direct, confidence: null, notes: "",
      navTrail: navTrail.slice() };
    results.push(pending);
    phase = "return";
    render();
  }

  function setConfidence(v) { confidence = v; results[results.length - 1].confidence = v; render(); }
  function setNotes(v) { results[results.length - 1].notes = v; }

  function resultsForDoc() {
    return results.map(function (r) {
      return { taskIndex: r.taskIndex, scenario: r.scenario, tests: r.tests, path: r.path,
        timeMs: r.timeMs, success: r.success, direct: r.direct, confidence: r.confidence, notes: r.notes,
        navTrail: r.navTrail || [] };
    });
  }

  // Writes the session's progress to its own ledger doc as each task is
  // logged, rather than only once at the very end -- a crash, closed tab or
  // moderator slip mid-session now leaves a resumable "in-progress" record
  // (see resumeSession()) instead of losing the whole run. Practice runs
  // are still never written to the shared ledger.
  function persistSession(isFinal) {
    if (practiceRun) return;
    var payload = {
      participant: participant,
      participantInternal: participantInternal,
      status: isFinal ? "completed" : "in-progress",
      startedAt: sessionStartedAtIso,
      contentVersion: sessionContentVersion,
      results: resultsForDoc(),
      updatedAt: new Date().toISOString(),
      finishedAt: isFinal ? new Date().toISOString() : null
    };
    if (dbReady && db) {
      if (sessionDocId) {
        db.collection("sessions").doc(sessionDocId).set(payload).catch(function () {});
      } else {
        db.collection("sessions").add(payload).then(function (ref) {
          sessionDocId = (ref && ref.id) ? ref.id : sessionDocId;
        }).catch(function () {});
      }
      return;
    }
    if (localStorageOk) {
      if (!sessionDocId) sessionDocId = "local-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
      var docs = localLedgerRead();
      var found = false;
      for (var i = 0; i < docs.length; i++) {
        if (docs[i]._id === sessionDocId) { docs[i] = Object.assign({ _id: sessionDocId }, payload); found = true; break; }
      }
      if (!found) docs.push(Object.assign({ _id: sessionDocId }, payload));
      localLedgerWrite(docs);
      refreshLocalLedger();
    }
  }

  function nextTask() {
    taskIndex++;
    openPath = []; backtrackCount = 0; candidatePath = null; confidence = null; navTrail = [];
    if (taskIndex >= activeTasks.length) {
      phase = "done";
      endedEarly = false;
      persistSession(true);
    } else {
      phase = "preview";
      persistSession(false);
    }
    render();
  }

  // Lets the moderator stop after any logged task instead of running the
  // full task list -- whatever's in `results` so far is saved exactly like
  // a normal finish.
  function endSessionEarly() {
    confirmEndSession = false;
    endedEarly = true;
    phase = "done";
    persistSession(true);
    render();
  }

  // Discards the just-logged attempt for the current task (nothing has hit
  // the shared ledger yet -- that only happens once the task is saved via
  // nextTask() -- so this is a plain in-memory undo) and hands the device
  // back to the participant to redo the same task from scratch.
  function retakeTask() {
    results.pop();
    openPath = []; backtrackCount = 0; candidatePath = null; confidence = null; navTrail = [];
    confirmRetake = false;
    retakePending = true;
    phase = "preview";
    render();
  }

  function goQuestion() {
    phase = "question";
    onboardStep = null;
    retakePending = false;
    render();
    if (taskIndex === 0) {
      // Let the participant see the plain screen for a beat before the
      // onboarding tour fades in over it.
      setTimeout(function () {
        if (phase === "question" && taskIndex === 0) {
          onboardStep = 1;
          renderOnboardTour();
        }
      }, 900);
    }
  }

  function goActive() {
    startedAt = Date.now();
    phase = "active";
    onboardStep = null;
    render();
    startTimerTick();
    if (taskIndex === 0) {
      // A third tour step, covering the tree-nav screen itself -- shown
      // once the participant has had a moment to look at it. Its own
      // visible time is excluded from this task's recorded duration (see
      // pauseTimerForOnboard()) so reading the tour doesn't count against
      // how long finding the answer took.
      setTimeout(function () {
        if (phase === "active" && taskIndex === 0) {
          onboardStep = 3;
          pauseTimerForOnboard();
          renderOnboardTour();
        }
      }, 900);
    }
  }

  function goCapture() {
    phase = "capture";
    render();
  }

  function startSetup() {
    view = "session"; phase = "setup"; participant = ""; practiceRun = false; participantInternal = false; taskIndex = 0;
    openPath = []; backtrackCount = 0; candidatePath = null; confidence = null; results = []; navTrail = [];
    endedEarly = false; confirmEndSession = false; confirmRetake = false; retakePending = false;
    sessionDocId = null; sessionStartedAtIso = null; sessionContentVersion = null; confirmDiscardResumeId = null;
    render();
  }
  // Participant names must be unique. The session ledger is the only source
  // of truth for "already used" -- since practice runs are never saved
  // there, they never make a name unavailable, but a new session (practice
  // or not) still can't reuse a name that's already in the ledger.
  function isDuplicateParticipant(name) {

  }

  function beginSession(name, isPractice, isInternal) {

    participant = name; practiceRun = isPractice; participantInternal = !!isInternal; taskIndex = 0; phase = "preview";
    openPath = []; backtrackCount = 0; results = []; navTrail = [];
    endedEarly = false; confirmEndSession = false; confirmRetake = false; retakePending = false;
    sessionDocId = null; sessionStartedAtIso = new Date().toISOString(); sessionContentVersion = activeContentVersion;
    render();

    // first task to finish) so even a crash before any task completes still
    // leaves a resumable record instead of nothing at all.
    if (!isPractice) persistSession(false);
  }

  // Continues an interrupted session -- one whose doc is still marked

  // whatever tasks it had already logged. Only non-practice sessions are
  // ever persisted, so there's never one of these to resume for a practice
  // run.
  function resumeSession(doc) {
    sessionDocId = doc._id;
    participant = doc.participant || "";
    practiceRun = false;
    participantInternal = !!doc.participantInternal;

    taskIndex = results.length;
    sessionContentVersion = doc.contentVersion || activeContentVersion;
    sessionStartedAtIso = doc.startedAt || new Date().toISOString();
    openPath = []; backtrackCount = 0; candidatePath = null; confidence = null; navTrail = [];
    endedEarly = false; confirmEndSession = false; confirmRetake = false; retakePending = false;
    confirmDiscardResumeId = null;

      phase = "done";
      endedEarly = false;

      phase = "preview";

  // Abandons an interrupted session for good -- the moderator has decided

  // ledger entirely rather than being left dangling as "in-progress"
  // forever.
  function discardInProgress(id) {
    if (dbReady && db) {
      db.collection("sessions").doc(id).delete().catch(function () {});
    } else if (localStorageOk) {
      localLedgerWrite(localLedgerRead().filter(function (d) { return d._id !== id; }));
      refreshLocalLedger();
    }
    confirmDiscardResumeId = null;
    render();
  }

  // ---------- Audience ----------
  // doTERRA staff already know this structure, so their runs are not
  // comparable to a customer's and blending the two lifts every success
  // figure. Everything on the Ledger reads through this filter: the
  // per-task stats, the session log and the export, so the numbers on
  // screen are always the numbers in the file.
  //
  // Deliberately NOT applied to the duplicate-name check, the resume
  // banner or the in-progress count: those must always see every session
  // regardless of what the Ledger is currently showing.
  function plural(n, word, suffix) {
    return n + " " + word + (n === 1 ? "" : (suffix || "s"));
  }
  function audienceDocs() {
    if (audienceFilter === "external") return ledgerDocs.filter(function (d) { return !d.participantInternal; });
    if (audienceFilter === "internal") return ledgerDocs.filter(function (d) { return !!d.participantInternal; });
    return ledgerDocs;
  }
  function audienceCounts(docs) {

    return { all: list.length, internal: internal, external: list.length - internal };
  }
  function audienceName(which) {
    return which === "external" ? "Customers" : which === "internal" ? "doTERRA staff" : "Everyone";
  }

  // filter, so an export says what is in it however it was produced.
  function audienceSummary(docs) {
    var c = audienceCounts(docs);
    if (!c.all) return "no participants";
    if (!c.internal) return plural(c.external, "customer");
    if (!c.external) return plural(c.internal, "doTERRA staff member");
    return plural(c.all, "participant") + " (" + c.external + " customer" + (c.external === 1 ? "" : "s") +
      ", " + c.internal + " doTERRA staff)";
  }

  // ---------- Ledger ----------
  function subscribeLedger() {
    if (dbReady && db) {
      if (ledgerUnsub) return;

        ledgerDocs = snap.docs.map(function (d) {
          var data = d.data();
          return data ? Object.assign({ _id: d.id }, data) : null;
        }).filter(Boolean);
        if (view === "ledger") render();
      }, function () {});
      return;
    }
    if (localStorageOk) refreshLocalLedger();
  }

  function findSessionToggle(docId) {
    var btns = document.querySelectorAll(".session-row-toggle");
    for (var i = 0; i < btns.length; i++) {
      if (btns[i].dataset.docId === docId) return btns[i];
    }
    return null;
  }
  function findDeleteBtn(docId) {
    var btns = document.querySelectorAll(".ledger-delete-btn");
    for (var i = 0; i < btns.length; i++) {
      if (btns[i].dataset.docId === docId) return btns[i];
    }
    return null;
  }
  function focusMainHeading() { return document.querySelector("main h2, main h1"); }

  function deleteSession(id) {
    if (dbReady && db) {
      db.collection("sessions").doc(id).delete().catch(function () {});
    } else if (localStorageOk) {
      localLedgerWrite(localLedgerRead().filter(function (d) { return d._id !== id; }));
      refreshLocalLedger();
    } else {
      return;
    }
    confirmDeleteId = null;
    scheduleFocus(focusMainHeading);
    render();
  }

  function clearAllSessions() {
    if (dbReady && db) {
      ledgerDocs.forEach(function (doc) {
        db.collection("sessions").doc(doc._id).delete().catch(function () {});
      });
    } else if (localStorageOk) {
      localLedgerWrite([]);
      refreshLocalLedger();
    } else {
      return;
    }
    confirmClearAll = false;
    scheduleFocus(focusMainHeading);
    render();
  }

  // Lets the moderator revisit a saved (recorded) session later and add or
  // amend a task's notes -- e.g. a follow-up thought after the fact. The
  // `results` array is replaced wholesale (db update() merges top-level
  // fields but not array contents), so it's cloned with just that one
  // entry's notes changed.
  function updateSessionNotes(docId, resultIndex, notesText, btn) {
    var doc = ledgerDocs.filter(function (d) { return d._id === docId; })[0];
    if (!doc) return;
    var newResults = (doc.results || []).map(function (r, i) {
      if (i !== resultIndex) return r;
      return Object.assign({}, r, { notes: notesText });
    });
    if (dbReady && db) {
      db.collection("sessions").doc(docId).update({ results: newResults }).then(function () {
        if (btn) { btn.textContent = "Saved"; setTimeout(function () { btn.textContent = "Save"; }, 1200); }
      }).catch(function () {
        if (btn) { btn.textContent = "Couldn't save"; setTimeout(function () { btn.textContent = "Save"; }, 1500); }
      });
    } else if (localStorageOk) {
      var docs = localLedgerRead();
      for (var i = 0; i < docs.length; i++) {
        if (docs[i]._id === docId) { docs[i] = Object.assign({}, docs[i], { results: newResults }); break; }
      }
      localLedgerWrite(docs);
      refreshLocalLedger();
      if (btn) { btn.textContent = "Saved"; setTimeout(function () { btn.textContent = "Save"; }, 1200); }
    } else if (btn) {
      btn.textContent = "Couldn't save"; setTimeout(function () { btn.textContent = "Save"; }, 1500);
    }
  }

  // Takes the docs explicitly rather than reading ledgerDocs, so the stats
  // always describe exactly the set the caller means.
  function ledgerStats(docs) {
    var byTask = activeTasks.map(function () { return { n: 0, direct: 0, indirect: 0, fail: 0, times: [] }; });
    (docs || []).forEach(function (doc) {
      (doc.results || []).forEach(function (r) {
        var b = byTask[r.taskIndex];
        if (!b) return;
        b.n++; b.times.push(r.timeMs);
        if (r.success && r.direct) b.direct++;
        else if (r.success && !r.direct) b.indirect++;
        else b.fail++;
      });
    });
    return byTask.map(function (b, i) {
      var sorted = b.times.slice().sort(function (a, c) { return a - c; });
      var median = sorted.length ? sorted[Math.floor(sorted.length / 2)] : 0;
      return { task: activeTasks[i], n: b.n,
        directPct: b.n ? Math.round((b.direct / b.n) * 100) : null,
        indirectPct: b.n ? Math.round((b.indirect / b.n) * 100) : null,
        failPct: b.n ? Math.round((b.fail / b.n) * 100) : null,
        median: median };
    });
  }

  function navTrailText(r) {
    return (r.navTrail || []).map(function (p) { return p.join(">"); }).join(" | ");
  }

  function participantTypeLabel(doc) {
    return doc.participantInternal ? "Internal (doTERRA staff)" : "External (customer)";
  }

  function csvForDocs(docs) {
    var rows = [["Participant", "Participant type", "Task #", "Scenario", "Result", "Path", "Nav trail", "Time (s)", "Confidence", "Notes", "Content v", "Finished at"]];
    docs.forEach(function (doc) {
      (doc.results || []).forEach(function (r) {
        rows.push([doc.participant, participantTypeLabel(doc), r.taskIndex + 1, r.scenario, resultLabel(r), r.path.join(" > "), navTrailText(r),
          Math.round(r.timeMs / 1000), r.confidence == null ? "" : r.confidence, r.notes || "", doc.contentVersion || "", doc.finishedAt]);
      });
    });
    return rows.map(function (row) {
      return row.map(function (v) {
        var s = String(v == null ? "" : v).replace(/"/g, '""');
        return /[",\n]/.test(s) ? '"' + s + '"' : s;
      }).join(",");
    }).join("\n");
  }

  function jsonForDocs(docs) {
    var data = docs.map(function (doc) {
      return {
        participant: doc.participant,
        participantType: doc.participantInternal ? "internal" : "external",
        status: doc.status || "completed",
        contentVersion: doc.contentVersion || null,
        finishedAt: doc.finishedAt,
        results: (doc.results || []).map(function (r) {
          return { taskIndex: r.taskIndex, scenario: r.scenario, tests: r.tests, path: r.path,
            timeMs: r.timeMs, success: r.success, direct: r.direct, confidence: r.confidence, notes: r.notes,
            navTrail: r.navTrail || [] };
        })
      };
    });
    return JSON.stringify(data, null, 2);
  }

  function mdEscape(s) {
    // Keeps scenario/path/notes text from breaking a Markdown table row.
    return String(s == null ? "" : s).replace(/\|/g, "\\|").replace(/\r?\n/g, " ");
  }

  function markdownForDocs(docs) {
    var lines = ["# Wayfinding Trial Results", "",
      "_Exported " + new Date().toLocaleString() + "_", "",
      "**Covers " + audienceSummary(docs) + ".**"];
    var comp = audienceCounts(docs);
    if (comp.internal && comp.external) {
      lines.push("", "> This export mixes doTERRA staff with customers. Staff already know this navigation structure, so the success rates read higher than a customer-only set would. Split them on the Participant type column of the CSV export before quoting anything.");
    }
    docs.forEach(function (doc) {
      lines.push("");
      lines.push("## " + (doc.participant || "(unnamed)"));
      lines.push("");
      lines.push("Status: " + (doc.status || "completed") + " · " + participantTypeLabel(doc) +
        (doc.contentVersion ? " · Content version: v" + doc.contentVersion : "") +
        (doc.finishedAt ? " · Finished: " + new Date(doc.finishedAt).toLocaleString() : ""));
      lines.push("");
      lines.push("| # | Scenario | Result | Path | Time | Confidence | Notes |");
      lines.push("|---|---|---|---|---|---|---|");
      (doc.results || []).forEach(function (r) {
        lines.push("| " + (r.taskIndex + 1) + " | " + mdEscape(r.scenario) + " | " + resultLabel(r) + " | " +
          mdEscape(r.path.join(" › ")) + " | " + fmtTime(r.timeMs) + " | " + (r.confidence == null ? "—" : r.confidence) +
          " | " + mdEscape(r.notes || "—") + " |");
      });
    });
    return lines.join("\n");
  }

  function slugify(s) {
    return (s || "session").toString().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "session";
  }

  // Works even when the Artifact's own `downloads` capability isn't there
  // (the file opened directly, or served from a plain local server) -- a
  // plain Blob + temporary <a download> is supported by any browser, so
  // exporting never depends on which runtime this page happens to be in.
  function triggerBrowserDownload(filename, data, mime) {
    try {
      var blob = new Blob([data], { type: mime || "text/plain" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      return true;
    } catch (e) { return false; }
  }

  function downloadCsv(docs, filenameBase) {
    var data = csvForDocs(docs);
    if (downloads) downloads.save({ filename: filenameBase + ".csv", data: data });
    else triggerBrowserDownload(filenameBase + ".csv", data, "text/csv");
  }

  function downloadJson(docs, filenameBase) {
    var data = jsonForDocs(docs);
    if (downloads) downloads.save({ filename: filenameBase + ".json", data: data });
    else triggerBrowserDownload(filenameBase + ".json", data, "application/json");
  }

  function downloadMarkdown(docs, filenameBase) {
    var data = markdownForDocs(docs);
    if (downloads) downloads.save({ filename: filenameBase + ".md", data: data });
    else triggerBrowserDownload(filenameBase + ".md", data, "text/markdown");
  }

  // ---------- Renderers ----------
  function renderBranchNode(node, prefix, level) {
    var wrap = el("div", {});
    if (Array.isArray(node)) {
      var list = el("div", { class: "leaf-list" });
      node.forEach(function (leaf) {
        var isSelected = !!candidatePath && pathsEqual(candidatePath, prefix.concat([leaf]));
        list.appendChild(el("button", {
          class: "leaf-btn" + (isSelected ? " selected" : ""),
          "data-leaf": leaf,
          "aria-pressed": String(isSelected),
          onclick: function () { clickLeaf(prefix, leaf); }
        }, isSelected ? [leaf, el("span", { class: "leaf-check", html: CHECK_ICON })] : [leaf]));
      });
      wrap.appendChild(list);
      return wrap;
    }
    var grid = el("div", { class: "branch-grid" });
    Object.keys(node).forEach(function (key) {
      var isOpen = openPath[level] === key;
      grid.appendChild(el("button", {
        class: "branch-btn" + (isOpen ? " open" : ""),
        "data-level": String(level), "data-key": key,
        "aria-expanded": String(isOpen),
        onclick: function () { clickBranch(level, key); }
      }, [key, el("span", { class: "arrow", "aria-hidden": "true" }, [isOpen ? "−" : "+"])]));
    });
    wrap.appendChild(grid);
    var activeKey = openPath[level];
    if (activeKey && node[activeKey] !== undefined) {
      wrap.appendChild(renderBranchNode(node[activeKey], prefix.concat([activeKey]), level + 1));
    }
    return wrap;
  }

  function renderBreadcrumb() {
    var bc = el("div", { class: "breadcrumb" });
    bc.appendChild(el("button", { onclick: function () { openPath = []; render(); } }, ["Home"]));
    openPath.forEach(function (seg, i) {
      bc.appendChild(el("span", { class: "sep" }, ["›"]));
      bc.appendChild(el("button", { onclick: function () { openPath = openPath.slice(0, i + 1); render(); } }, [seg]));
    });
    return bc;
  }

  // A session interrupted mid-run (browser closed, crash, moderator moved
  // on by accident) is written incrementally, so it's still sitting in the
  // ledger as "in-progress" -- surface it here so the moderator can pick up
  // exactly where it left off instead of losing everything, or explicitly
  // abandon it.
  function renderResumeBanner() {
    var pending = ledgerDocs.filter(function (d) { return d.status === "in-progress"; });
    if (!pending.length) return null;
    var frag = document.createDocumentFragment();
    pending.forEach(function (doc) {
      var isConfirming = confirmDiscardResumeId === doc._id;
      var card = el("div", { class: "card", style: "border-color:var(--warn); background:var(--warn-bg);" });
      card.appendChild(el("div", { class: "eyebrow", style: "color:var(--warn);" }, ["INTERRUPTED SESSION"]));
      card.appendChild(el("p", { style: "margin:0 0 12px;" }, [
        "“" + (doc.participant || "(unnamed)") + "” (" + participantTypeLabel(doc) + ") stopped after " + (doc.results || []).length + " of " + activeTasks.length + " task(s), without finishing. Resume it, or discard it and start fresh."
      ]));
      if (isConfirming) {
        card.appendChild(el("div", { class: "btn-row", style: "margin-top:0;" }, [
          el("span", { class: "hint", style: "align-self:center; margin:0;" }, ["Discard this session for good?"]),
          el("button", { class: "btn btn-ghost", onclick: function () { confirmDiscardResumeId = null; render(); } }, ["Cancel"]),
          el("button", { class: "btn btn-primary", style: "background:var(--fail);", onclick: function () { discardInProgress(doc._id); } }, ["Yes, discard"])
        ]));
      } else {
        card.appendChild(el("div", { class: "btn-row", style: "margin-top:0;" }, [
          el("button", { class: "btn btn-primary", onclick: function () { resumeSession(doc); } }, ["Resume session →"]),
          el("button", { class: "btn btn-ghost", onclick: function () { confirmDiscardResumeId = doc._id; render(); } }, ["Discard"])
        ]));
      }
      frag.appendChild(card);
    });
    return frag;
  }

  function renderSetup() {
    var resumeBanner = renderResumeBanner();
    var card = el("div", { class: "card" });
    card.appendChild(el("h2", {}, ["Start a session"]));
    card.appendChild(el("p", { class: "hint" }, ["One participant at a time, " + activeTasks.length + " task" + (activeTasks.length === 1 ? "" : "s") + ", text-only navigation. Let them click without hints, and only confirm when they'd genuinely act on it."]));
    card.appendChild(el("label", { class: "field", for: "participant-input" }, ["Participant"]));
    var input = el("input", {
      type: "text", id: "participant-input", placeholder: "e.g. P1, or a name",
      "aria-describedby": "participant-name-error"
    });
    input.value = participant;
    card.appendChild(input);
    var nameError = el("p", {
      id: "participant-name-error", class: "hint", role: "alert",
      style: "margin:6px 0 0; color:var(--fail); display:none;"
    }, ["That name’s already been used. Each participant needs a unique name."]);
    card.appendChild(nameError);
    var practice = el("input", { type: "checkbox", id: "practice-check" });
    var practiceRow = el("div", { style: "margin-top:12px; display:flex; align-items:center; gap:8px;" }, [
      practice, el("label", { for: "practice-check", style: "font-size:13px; color:var(--muted);" }, ["Practice run, don’t save to the shared ledger"])
    ]);
    card.appendChild(practiceRow);
    var internalCheck = el("input", { type: "checkbox", id: "internal-check" });
    var internalRow = el("div", { style: "margin-top:8px; display:flex; align-items:center; gap:8px;" }, [
      internalCheck, el("label", { for: "internal-check", style: "font-size:13px; color:var(--muted);" }, ["Internal participant (doTERRA staff), rather than a customer"])
    ]);
    card.appendChild(internalRow);
    var startBtn = el("button", { class: "btn btn-primary cta-primary", disabled: "disabled" }, ["Begin session →", ctaKey()]);
    function refreshStartState() {
      var name = input.value.trim();
      var dup = isDuplicateParticipant(name);
      nameError.style.display = dup ? "block" : "none";
      input.setAttribute("aria-invalid", String(dup));
      startBtn.disabled = !name || dup;
    }
    input.addEventListener("input", refreshStartState);
    refreshStartState();
    startBtn.addEventListener("click", function () { beginSession(input.value.trim(), practice.checked, internalCheck.checked); });
    card.appendChild(el("div", { class: "btn-row" }, [startBtn]));
    var setupStorageMode = storageMode();
    if (setupStorageMode === "none") {
      card.appendChild(el("div", { class: "warn-note" }, ["No results storage is available in this view. Sessions will still run, but results won’t be saved anywhere."]));
    } else if (setupStorageMode === "local") {
      card.appendChild(el("div", { class: "warn-note" }, [
        "Results are being saved to this browser’s local storage only, not synced across devices, and cleared browsing data would take it with them. Export from the Ledger tab regularly to keep a copy elsewhere, or open the published Artifact for a live, shared ledger."
      ]));
    }
    var details = el("details", { class: "method" });
    details.appendChild(el("summary", {}, ["Method, for the moderator"]));
    details.appendChild(el("div", { class: "body" }, [
      "Read the scenario aloud, don’t use the exact nav labels. Let them navigate freely, including backtracking, that’s data. " + directRuleText() + " Aim for 6–10 participants. This gives you directional signal, not the statistical confidence a larger unmoderated run would, treat a clear pattern as a strong steer, not a final number."
    ]));
    card.appendChild(details);
    if (!resumeBanner) return card;
    var frag = document.createDocumentFragment();
    frag.appendChild(resumeBanner);
    frag.appendChild(card);
    return frag;
  }

  function renderPreview() {
    var card = el("div", { class: "card handoff-card" });
    card.appendChild(el("div", { class: "eyebrow" }, ["MODERATOR · TASK " + (taskIndex + 1) + " OF " + activeTasks.length + (practiceRun ? " · PRACTICE" : "")]));
    card.appendChild(renderHandoffGraphic("participant"));
    card.appendChild(el("div", { class: "scenario" }, [retakePending ? "Ready to retry this task." : "Ready for the next task."]));
    card.appendChild(el("p", { class: "hint" }, [retakePending
      ? "Hand the device back to the participant. The previous attempt was discarded, they’ll see the same scenario again from scratch."
      : "Hand the device to the participant now. They’ll see the task themselves and start it when they’re ready, nothing else is on their screen."]));
    card.appendChild(el("div", { class: "btn-row" }, [
      el("button", { class: "btn btn-primary btn-big cta-primary", onclick: goQuestion }, ["Pass to participant →", ctaKey()])
    ]));
    return card;
  }

  function renderQuestion() {
    var task = activeTasks[taskIndex];
    var isFirstTask = taskIndex === 0;
    var card = el("div", { class: "card" });
    card.appendChild(el("div", { class: "eyebrow muted" }, ["PARTICIPANT"]));
    card.appendChild(el("div", { class: "progress-row" }, [
      el("span", { class: "step" }, ["TASK " + (taskIndex + 1) + " OF " + activeTasks.length]),
      practiceRun ? el("span", { class: "timer" }, ["00:00"]) : null
    ]));
    card.appendChild(el("div", { class: "scenario", id: isFirstTask ? "onboard-target-scenario" : undefined }, [task.scenario]));
    card.appendChild(el("div", { class: "btn-row", style: "align-items:center;" }, [
      el("button", { class: "btn btn-primary cta-primary", id: isFirstTask ? "onboard-target-start" : undefined, onclick: goActive }, ["Start →", ctaKey()]),
      el("span", { class: "think-aloud-note" }, [
        el("span", { class: "think-aloud-icon", html: SPEECH_ICON }),
        "Remember to think out loud as you go"
      ])
    ]));
    return card;
  }

  function renderActive() {
    var task = activeTasks[taskIndex];
    var isFirstTask = taskIndex === 0;
    var card = el("div", { class: "card" });
    card.appendChild(el("div", { class: "eyebrow muted" }, ["PARTICIPANT"]));
    card.appendChild(el("div", { class: "progress-row" }, [
      el("span", { class: "step" }, ["TASK " + (taskIndex + 1) + " OF " + activeTasks.length]),
      practiceRun ? el("span", { class: "timer", id: "timer-readout" }, ["00:00"]) : null
    ]));
    card.appendChild(el("div", { class: "scenario" }, [task.scenario]));
    // Wrapped together so the onboarding spotlight (first task only) can
    // highlight the whole navigable area, not just the breadcrumb.
    var navWrap = el("div", { id: isFirstTask ? "onboard-target-tree" : undefined });
    navWrap.appendChild(renderBreadcrumb());
    if (openPath.length) {
      // The two ways to go back (the breadcrumb above vs. tapping an
      // already-open category to collapse it) can otherwise read as
      // redundant -- a one-line hint instead of removing either, since
      // they do different jobs (jump to an ancestor vs. collapse locally).
      navWrap.appendChild(el("p", { class: "hint", style: "font-size:11px; margin:-6px 0 12px;" }, [
        "Tap a step above to jump back, or tap the highlighted category again to collapse it."
      ]));
    }
    navWrap.appendChild(renderBranchNode(activeTree, [], 0));
    card.appendChild(navWrap);

    if (candidatePath) {
      var bar = el("div", { class: "confirm-bar" }, [
        el("div", {}, [el("div", { style: "font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em;" }, ["You’d look here"]),
          el("div", { class: "path" }, [candidatePath.join(" › ")])]),
        el("div", { class: "btn-row", style: "margin:0;" }, [
          el("button", { class: "btn btn-ghost", onclick: cancelCandidate }, ["Keep looking"]),
          el("button", { class: "btn btn-primary cta-primary", onclick: confirmCandidate }, ["This is my answer", ctaKey()])
        ])
      ]);
      card.appendChild(bar);
    }

    return card;
  }

  function renderReturn() {
    var card = el("div", { class: "card handoff-card" });
    card.appendChild(el("div", { class: "eyebrow muted" }, ["HANDOFF"]));
    card.appendChild(renderHandoffGraphic("moderator"));
    card.appendChild(el("div", { class: "scenario" }, ["Task complete."]));
    card.appendChild(el("p", { class: "hint" }, ["Please hand the device back to the moderator."]));
    card.appendChild(el("div", { class: "btn-row" }, [
      el("button", { class: "btn btn-primary btn-big cta-primary", onclick: goCapture }, ["I’m the moderator →", ctaKey()])
    ]));
    return card;
  }

  function renderCapture() {
    var r = results[results.length - 1];
    var card = el("div", { class: "card" });
    card.appendChild(el("div", { class: "eyebrow" }, ["MODERATOR"]));
    card.appendChild(el("h2", {}, ["Task " + (taskIndex + 1) + " logged"]));
    card.appendChild(el("div", { class: "badge " + resultClass(r), style: "margin-bottom:14px;" }, [resultLabel(r) + " · " + fmtTime(r.timeMs)]));
    card.appendChild(el("label", { class: "field" }, ["Confidence, ask the participant"]));
    var chips = el("div", { class: "chip-row", style: "margin-bottom:4px;", role: "group", "aria-label": "Confidence, from 1, not at all confident, to 5, very confident" });
    [1, 2, 3, 4, 5].forEach(function (v) {
      chips.appendChild(el("button", { class: "chip" + (confidence === v ? " selected" : ""), "aria-pressed": String(confidence === v), onclick: function () { setConfidence(v); } }, [String(v)]));
    });
    card.appendChild(chips);
    // Anchor labels on the ends only -- enough to tell 1 and 5 apart
    // without a caption under every chip.
    card.appendChild(el("div", { class: "hint", "aria-hidden": "true", style: "display:flex; justify-content:space-between; max-width:220px; margin:0 0 8px; font-size:11px;" }, [
      el("span", {}, ["Not confident"]), el("span", {}, ["Very confident"])
    ]));
    if (confidence == null) {
      card.appendChild(el("p", { class: "hint", style: "margin:0 0 16px; font-size:12px;" }, ["Required before you can continue."]));
    } else {
      card.appendChild(el("div", { style: "margin-bottom:16px;" }));
    }
    card.appendChild(el("label", { class: "field" }, ["Notes"]));
    var notes = el("textarea", { placeholder: "What they said, hesitation, wrong turns worth remembering…" });
    notes.value = r.notes || "";
    notes.addEventListener("input", function () { setNotes(notes.value); });
    card.appendChild(notes);

    if (confirmRetake) {
      // Retaking only redoes the one task just logged -- a routine, easily
      // repeated moderator action, so it reads as a plain caution (amber)
      // rather than the harder stop reserved for ending the whole session.
      card.appendChild(el("div", {
        class: "warn-note", role: "alertdialog", "aria-label": "Confirm retake task",
        style: "display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-top:4px; margin-bottom:16px;"
      }, [
        el("span", {}, ["Discard this result and redo task " + (taskIndex + 1) + " from the start?"]),
        el("div", { style: "display:flex; gap:8px;" }, [
          el("button", {
            id: "retake-cancel-btn", class: "btn btn-ghost",
            onclick: function () {
              confirmRetake = false;
              scheduleFocus(function () { return document.getElementById("retake-task-btn"); });
              render();
            }
          }, ["Cancel"]),
          el("button", { class: "btn btn-primary", onclick: retakeTask }, ["Yes, retake"])
        ])
      ]));
    }

    var tasksRemaining = activeTasks.length - (taskIndex + 1);
    if (confirmEndSession) {
      // Ending early is the more consequential of the two actions -- it
      // finalises the session and the remaining tasks never run -- so it
      // gets the stronger (red) treatment that retake used to carry.
      card.appendChild(el("div", {
        class: "warn-note", role: "alertdialog", "aria-label": "Confirm end session early",
        style: "display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-top:4px; margin-bottom:16px; color:var(--fail); background:var(--fail-bg);"
      }, [
        el("span", {}, ["End the session now? " + results.length + " task" + (results.length === 1 ? "" : "s") + " will be " +
          (practiceRun ? "kept for this screen only (practice run, not saved to the ledger)." : "saved to the shared ledger.") +
          " The remaining " + tasksRemaining + " task" + (tasksRemaining === 1 ? "" : "s") + " won’t run."]),
        el("div", { style: "display:flex; gap:8px;" }, [
          el("button", {
            id: "end-session-cancel-btn", class: "btn btn-ghost",
            onclick: function () {
              confirmEndSession = false;
              scheduleFocus(function () { return document.getElementById("end-session-btn"); });
              render();
            }
          }, ["Cancel"]),
          el("button", { class: "btn btn-primary", style: "background:var(--fail);", onclick: endSessionEarly }, ["Yes, end session"])
        ])
      ]));
    }

    if (!confirmRetake && !confirmEndSession) {
      // Same severity swap as the confirm banners above: retake is a

  function renderExportMenu(menuId, docsProvider, filenameBase, showLabel) {
    var isOpen = openExportMenu === menuId;
    var wrap = el("div", { class: "export-menu-wrap", "data-menu-id": String(menuId) });
    var toggle = el("button", {
      class: showLabel ? "btn btn-ghost" : "icon-btn",
      style: showLabel ? "display:inline-flex; align-items:center; gap:6px;" : "",
      "aria-label": "Export", title: "Export",
      "aria-haspopup": "true", "aria-expanded": String(isOpen)
