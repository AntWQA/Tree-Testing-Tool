      ? [el("span", { style: "display:inline-flex;", html: EXPORT_ICON }), "Export", el("span", { style: "display:inline-flex;", html: CHEVRON_ICON, class: "chevron-down" })]
      : [el("span", { style: "display:inline-flex;", html: EXPORT_ICON })]);
    toggle.addEventListener("click", function () {
      var opening = !isOpen;
      openExportMenu = isOpen ? null : menuId;
      scheduleFocus(function () {
        var w = findExportWrap(menuId);
        if (!w) return null;
        return opening ? w.querySelector(".export-menu button") : w.firstElementChild;
      });
      render();
    });
    wrap.appendChild(toggle);

    if (isOpen) {
      // Downloading no longer depends on the Artifact's own `downloads`
      // capability -- downloadCsv/downloadJson/downloadMarkdown fall back
      // to a plain browser download when it isn't there, so these always
      // work, published or run standalone.
      var menu = el("div", { class: "export-menu", role: "menu" });
      [
        ["Download CSV (spreadsheet)", downloadCsv],
        ["Download Markdown", downloadMarkdown],
        ["Download JSON", downloadJson]
      ].forEach(function (pair) {
        var btn = el("button", { role: "menuitem" }, [pair[0]]);
        btn.addEventListener("click", function () {
          pair[1](docsProvider(), filenameBase);
          openExportMenu = null;
          scheduleFocus(function () { var w = findExportWrap(menuId); return w ? w.firstElementChild : null; });
          render();
        });
        menu.appendChild(btn);
      });
      var copyBtn = el("button", { role: "menuitem" }, ["Copy as CSV"]);
      copyBtn.addEventListener("click", function () { copyToClipboard(csvForDocs(docsProvider()), copyBtn); });
      menu.appendChild(copyBtn);
      wrap.appendChild(menu);
    }
    return wrap;
  }
  function findExportWrap(menuId) {
    var wraps = document.querySelectorAll(".export-menu-wrap");

  }
  function closeExportMenu() {
    var prev = openExportMenu;

  function renderContent() {
    if (treeDraft == null) treeDraft = JSON.stringify(activeTree, null, 2);
    if (tasksDraft == null) tasksDraft = JSON.stringify(activeTasks, null, 2);
    if (toleranceDraft == null) toleranceDraft = String(successBacktrackTolerance);

    var frag = document.createDocumentFragment();

    var intro = el("div", { class: "card" });
    intro.appendChild(el("div", { style: "display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px;" }, [
      el("h2", { style: "margin:0;" }, ["Content"]),
      el("span", { class: "hint", style: "margin:0; font-size:12px;" }, [
        "Live: v" + activeContentVersion + (contentUpdatedAt ? " · saved " + new Date(contentUpdatedAt).toLocaleString() : "")
      ])
    ]));
    var contentStorageMode = storageMode();
    intro.appendChild(el("p", { class: "hint" }, [
      contentStorageMode === "shared"
        ? "Edit the navigation structure participants see and the tasks they're given, as plain JSON. Saved changes sync to every device running this tool, as a new version -- past sessions keep the version they were run against."
        : contentStorageMode === "local"
          ? "Edit the navigation structure participants see and the tasks they're given, as plain JSON. Saved changes are kept in this browser's local storage only, as a new version -- they won't sync to any other device or the published Artifact."
          : "Edit the navigation structure participants see and the tasks they're given, as plain JSON. No storage is available in this view, so changes apply here only and won't be saved for next time."
    ]));
    var inFlight = ledgerDocs.filter(function (d) { return d.status === "in-progress"; }).length;
    if (contentStorageMode !== "none" && inFlight > 0) {
      intro.appendChild(el("div", { class: "warn-note" }, [
        "Heads up: " + inFlight + " session" + (inFlight === 1 ? " is" : "s are") + " currently in progress on v" + activeContentVersion + ". Saving publishes v" + (activeContentVersion + 1) +
        (contentStorageMode === "shared"
          ? " to every device immediately -- those sessions keep the v" + activeContentVersion + " tag they started with, but anyone about to hand off a new task will see the updated structure right away."
          : " immediately -- that in-progress session keeps the v" + activeContentVersion + " tag it started with, but the next task handed off will use the updated structure right away.")
      ]));
    }
    if (contentError) {
      intro.appendChild(el("div", { class: "warn-note", style: "color:var(--fail); background:var(--fail-bg);" }, [contentError]));
    }
    if (contentWarning) {

    frag.appendChild(intro);

    var scoringCard = el("div", { class: "card" });
    scoringCard.appendChild(el("label", { class: "field", for: "tolerance-input" }, ["Backtrack tolerance"]));
    scoringCard.appendChild(el("p", { class: "hint", style: "margin-top:2px; font-size:12px;" }, [

    ]));

    toleranceInput.value = toleranceDraft;

    scoringCard.appendChild(toleranceInput);
    frag.appendChild(scoringCard);

    var treeCard = el("div", { class: "card" });

    treeCard.appendChild(el("div", { style: "display:flex; justify-content:space-between; align-items:center; gap:8px;" }, [
      el("label", { class: "field", style: "margin-bottom:0;" }, ["Navigation structure (IA)"]),
      treeCopyBtn
    ]));
    treeCard.appendChild(el("p", { class: "hint", style: "margin-top:2px; font-size:12px;" }, ["An object nested by branch, ending in an array of leaf labels."]));
    treeCard.appendChild(treeArea);
    frag.appendChild(treeCard);

    var tasksCard = el("div", { class: "card" });
    var tasksArea = el("textarea", { class: "code-editor", spellcheck: "false" });

    tasksCopyBtn.addEventListener("click", function () { copyToClipboard(tasksArea.value, tasksCopyBtn, tasksArea); });
    tasksCard.appendChild(el("div", { style: "display:flex; justify-content:space-between; align-items:center; gap:8px;" }, [

    tasksCard.appendChild(el("p", { class: "hint", style: "margin-top:2px; font-size:12px;" }, ["An array of { scenario, tests, accepted }, where accepted is a list of leaf paths from the structure above."]));
    tasksCard.appendChild(tasksArea);

    tasksCard.appendChild(el("div", { class: "btn-row" }, [
      el("button", { class: "btn btn-primary", onclick: function () { saveContent(treeDraft, tasksDraft, toleranceDraft); } }, ["Save changes"]),
      el("button", {
        class: "btn btn-ghost",
        onclick: function () { treeDraft = null; tasksDraft = null; toleranceDraft = null; contentError = null; contentWarning = null; render(); }
      }, ["Discard edits"]),

          showNav ? el("button", {
            id: "shortcuts-btn", class: "icon-btn", onclick: function () { toggleShortcuts(); },
            "aria-label": "Keyboard shortcuts", title: "Keyboard shortcuts (?)",
            html: KEYBOARD_ICON
          }) : null
        ])
      ])
    ]);
    app.appendChild(header);

    var main = el("main", { class: "wrap" + (view === "ledger" || view === "content" ? " wide" : ""), tabindex: "-1" });
    if (view === "ledger") {
      main.appendChild(renderLedger());
    } else if (view === "content") {
      main.appendChild(renderContent());
    } else if (phase === "setup") {
      main.appendChild(renderSetup());
    } else if (phase === "preview") {
      main.appendChild(renderPreview());
    } else if (phase === "question") {
      main.appendChild(renderQuestion());
    } else if (phase === "active") {
      main.appendChild(renderActive());
    } else if (phase === "return") {
      main.appendChild(renderReturn());
    } else if (phase === "capture") {
      main.appendChild(renderCapture());
    } else if (phase === "done") {
      main.appendChild(renderDone());
    }
    var phaseKey = view + ":" + phase;
    var isNewScreen = phaseKey !== lastPhaseKey;
    if (isNewScreen) main.classList.add("phase-enter");
    lastPhaseKey = phaseKey;
    app.appendChild(main);

    if (phase === "active" && startedAt && !onboardPauseStart) startTimerTick(); else stopTimerTick();

    if (onboardStep && (phase === "question" || phase === "active")) {
      requestAnimationFrame(renderOnboardTour);
    } else {
      removeOnboardTour();
    }

    // Keyboard-focus management: a full re-render replaces every element, so
    // the browser would otherwise drop focus to <body> on every interaction.
    // An action that knows where focus should land (a menu opening, a row
    // toggling) sets pendingFocus before calling render(); otherwise, moving
    // to a genuinely new screen focuses the main region so keyboard and
    // screen-reader users land at the top of the new content.
    if (pendingFocus) {
      var focusFn = pendingFocus;
      pendingFocus = null;
      var target = focusFn();
      if (target && typeof target.focus === "function") target.focus();
    } else if (isNewScreen) {
      main.focus();
    }
  }

  function navVisible() {
    return view === "ledger" || view === "content" || phase === "setup" || phase === "capture" || phase === "done";
  }

  function scheduleFocus(fn) { pendingFocus = fn; }

  function switchView(name) {
    view = name;
    if (name === "ledger") subscribeLedger();
    scheduleFocus(function () { return document.querySelector('nav.views button[data-view="' + name + '"]'); });
    render();
  }

  window.addEventListener("resize", function () {
    if (onboardStep && (phase === "question" || phase === "active")) renderOnboardTour();
  });

  document.addEventListener("click", function (e) {
    if (openExportMenu !== null && !e.target.closest(".export-menu-wrap")) {
      openExportMenu = null;
      render();
    }
  });

  // ---------- Keyboard shortcuts ----------
  // Appended to <body> like the onboarding tour, so it overlays whatever
  // screen is currently showing rather than needing its own phase/view.
  var SHORTCUTS = [
    { keys: ["↵"], desc: "Activate the highlighted button", scope: "Wherever one’s shown" },
    { keys: ["Esc"], desc: "Close menus and dialogs", scope: null },
    { keys: ["?"], desc: "Show or hide this list", scope: "Moderator screens" },
    { keys: ["1"], desc: "Switch to Session", scope: "Moderator screens" },
    { keys: ["2"], desc: "Switch to Ledger", scope: "Moderator screens" },
    { keys: ["3"], desc: "Switch to Content", scope: "Moderator screens" },
    { keys: ["T"], desc: "Toggle light / dark theme", scope: "Moderator screens" },
    { keys: [isMac() ? "⌘" : "Ctrl", "S"], desc: "Save content changes", scope: "Content tab" }
  ];

  function isMac() { return /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || ""); }

  function removeShortcutsPanel() {
    var el2 = document.getElementById("shortcuts-root");
    if (el2) el2.remove();
  }

  function toggleShortcuts(force) {
    shortcutsOpen = typeof force === "boolean" ? force : !shortcutsOpen;
    if (shortcutsOpen) {
      renderShortcutsPanel();
    } else {
      removeShortcutsPanel();
      var btn = document.getElementById("shortcuts-btn");
      if (btn) btn.focus();
    }
  }

  function renderShortcutsPanel() {
    removeShortcutsPanel();
    var backdrop = document.createElement("div");
    backdrop.id = "shortcuts-root";
    backdrop.className = "shortcuts-backdrop";
    backdrop.addEventListener("mousedown", function (e) {
      if (e.target === backdrop) toggleShortcuts(false);
    });

    var panel = document.createElement("div");
    panel.className = "shortcuts-panel";
    panel.setAttribute("role", "dialog");
    panel.setAttribute("aria-modal", "true");
    panel.setAttribute("aria-labelledby", "shortcuts-title");
    panel.tabIndex = -1;

    var head = document.createElement("div");
    head.style.cssText = "display:flex; justify-content:space-between; align-items:center; gap:12px;";
    var h = document.createElement("h2");
    h.id = "shortcuts-title";
    h.style.margin = "0";
    h.textContent = "Keyboard shortcuts";
    var closeBtn = document.createElement("button");
    closeBtn.className = "icon-btn";
    closeBtn.setAttribute("aria-label", "Close");
    closeBtn.innerHTML = CLOSE_ICON;
    closeBtn.addEventListener("click", function () { toggleShortcuts(false); });
    head.appendChild(h);
    head.appendChild(closeBtn);
    panel.appendChild(head);
    panel.appendChild(Object.assign(document.createElement("p"), {
      className: "hint", style: "margin-top:6px;",
      textContent: "Shortcuts are ignored while you're typing in a text field, except Esc and Save."
    }));

    var list = document.createElement("ul");
    list.className = "shortcuts-list";
    SHORTCUTS.forEach(function (s) {
      var li = document.createElement("li");
      var descWrap = document.createElement("span");
      var descEl = document.createElement("span");
      descEl.className = "desc";
      descEl.textContent = s.desc;
      descWrap.appendChild(descEl);
      if (s.scope) {
        var scopeEl = document.createElement("span");
        scopeEl.className = "scope";
        scopeEl.textContent = s.scope;
        descWrap.appendChild(scopeEl);
      }
      var kbdRow = document.createElement("span");
      kbdRow.className = "kbd-row";
      s.keys.forEach(function (k) {
        var kbd = document.createElement("kbd");
        kbd.className = "kbd";
        kbd.textContent = k;
        kbdRow.appendChild(kbd);
      });
      li.appendChild(descWrap);
      li.appendChild(kbdRow);
      list.appendChild(li);
    });
    panel.appendChild(list);

    backdrop.appendChild(panel);
    document.body.appendChild(backdrop);
    panel.focus();
  }

  document.addEventListener("keydown", function (e) {
    // The shortcuts panel is the only truly modal overlay here (a full
    // backdrop) and has just one focusable control, so keep Tab from
    // leaking focus out to whatever is behind it.
    if (shortcutsOpen && e.key === "Tab") {
      e.preventDefault();
      var closeBtn = document.querySelector(".shortcuts-panel .icon-btn");
      if (closeBtn) closeBtn.focus();
      return;
    }

    var tag = (document.activeElement && document.activeElement.tagName) || "";
    var typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (document.activeElement && document.activeElement.isContentEditable);

    // Works even while typing in the Content tab's JSON editors -- that's
    // the whole point of a save shortcut.
    if ((e.metaKey || e.ctrlKey) && !e.altKey && e.key.toLowerCase() === "s" && view === "content") {
      e.preventDefault();
      saveContent(treeDraft, tasksDraft, toleranceDraft);
      return;
    }

    if (e.key === "Escape") {
      if (shortcutsOpen) { toggleShortcuts(false); return; }
      if (openExportMenu !== null) { closeExportMenu(); return; }
      if (onboardStep && (phase === "question" || phase === "active")) { skipOnboardTour(); return; }
      if (confirmRetake) {
        confirmRetake = false;
        scheduleFocus(function () { return document.getElementById("retake-task-btn"); });
        render();
        return;
      }
      if (confirmEndSession) {
        confirmEndSession = false;
        scheduleFocus(function () { return document.getElementById("end-session-btn"); });
        render();
        return;
      }
      if (confirmDeleteId !== null) {
        var wasId = confirmDeleteId;
        confirmDeleteId = null;
        scheduleFocus(function () { return findDeleteBtn(wasId); });
        render();
        return;
      }
      if (confirmClearAll) {
        confirmClearAll = false;
        scheduleFocus(function () { return document.getElementById("clear-all-btn"); });
        render();
        return;
      }
      return;
    }

    // Enter activates the screen's highlighted primary action (marked with
    // .cta-primary and shown with its own ↵ hint) even when nothing has
    // been Tabbed to yet. If a button already has focus, leave it to the
    // browser's own native Enter-activation instead of also triggering here
    // -- otherwise the two would fire together. Available on every screen,
    // participant-facing ones included, since it's a hint on the button
    // itself rather than the (moderator-only) shortcuts panel.
    if (e.key === "Enter" && !e.metaKey && !e.ctrlKey && !e.altKey) {
      var activeTag = document.activeElement ? document.activeElement.tagName : "";
      var blocksEnter = activeTag === "TEXTAREA" || activeTag === "SELECT" || activeTag === "BUTTON" ||
        (document.activeElement && document.activeElement.isContentEditable);
      if (!blocksEnter) {
        // The onboarding tour sits on top of the question screen without
        // being a real focus trap (its tip is just a focused div, not a
        // button), so without this Enter would fall straight through to
        // the "Start" CTA underneath and start the task mid-tour. While
        // the tour is up, Enter drives IT -- advancing to the next step,
        // or finishing on the last one -- exactly like clicking its own
        // "Next"/"Got it" button would.
        if (onboardStep && (phase === "question" || phase === "active")) {
          var tourNext = document.querySelector("#onboard-tour-root .onboard-tip-actions .btn-primary");
          if (tourNext) { e.preventDefault(); tourNext.click(); }
        } else {
          var cta = document.querySelector("main .cta-primary");
          if (cta && !cta.disabled) { e.preventDefault(); cta.click(); }
        }
      }
      return;
    }

    if (e.metaKey || e.ctrlKey || e.altKey) return;

    if (typing) return;

    // The shortcuts panel documents moderator-only shortcuts (view switching,
    // theme, save), so it -- and the "?" that opens it -- stay out of the
    // participant's hands along with the rest of the moderator nav.
    if (navVisible()) {
      if (e.key === "?") { toggleShortcuts(); return; }
      if (e.key === "1") { switchView("session"); return; }
      if (e.key === "2") { switchView("ledger"); return; }
      if (e.key === "3") { switchView("content"); return; }
      if (e.key.toLowerCase() === "t") { toggleTheme(); return; }
    }
  });

  function boot(hotData) {
    restoreState(hotData);
    initCapabilities();
    render();
  }

  if (window.claude && window.claude.hot && window.claude.hot.ready) {
    window.claude.hot.ready(function () { boot(window.claude.hot.data || {}); });
  } else {
    boot({});
  }
})();
</script>
